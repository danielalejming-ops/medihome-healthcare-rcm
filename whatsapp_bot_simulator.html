La tranquilidad de saber que tus padres en Valencia están en las mejores manos:

      fallback_empathetic: `🩺 *Hola, te saluda Lisa de MEDIHOME Valencia.*

    };

    function addMessage(text, isUser = false) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `flex ${isUser ? 'justify-end' : 'justify-start'} animate-fade-in`;
      
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      
      let formattedText = text
        .replace(/\*(.*?)\*/g, '<strong>$1</strong>')
        .replace(/_(.*?)_/g, '<em>$1</em>')
        .replace(/\n/g, '<br>');

      msgDiv.innerHTML = `
        <div class="max-w-[85%] rounded-2xl px-3.5 py-2 text-xs shadow-md ${
          isUser 
            ? 'bg-[#005c4b] text-white rounded-tr-none' 
            : 'bg-[#202c33] text-slate-100 rounded-tl-none border border-slate-700/50'
        }">
          <div>${formattedText}</div>
          <div class="text-[10px] text-right mt-1 text-slate-400 flex items-center justify-end gap-1">
            <span>${time}</span>
            ${isUser ? '<span class="text-teal-300">✓✓</span>' : ''}
          </div>
        </div>
      `;
      container.appendChild(msgDiv);
      container.scrollTop = container.scrollHeight;
    }

    function showTypingAndReply(replyText) {
      botStatus.innerText = "Lisa está escribiendo...";
      botStatus.className = "text-[11px] text-teal-300 italic font-medium";

      setTimeout(() => {
        botStatus.innerText = "en línea";
        botStatus.className = "text-[11px] text-emerald-400 font-medium";
        addMessage(replyText, false);
      }, 700);
    }

    function processUserInput(text) {
      const clean = text.trim().toLowerCase();
      
      if (clean === '1' || clean === '0' || clean.includes('emergencia') || clean.includes('urgente') || clean.includes('grave') || clean.includes('desmay') || clean.includes('pecho') || clean.includes('ahogo') || clean.includes('convuls')) {
        showTypingAndReply(BOT_RESPONSES['1']);
      } else if (clean === '2' || clean.includes('medico a domicilio') || clean.includes('doctor a domicilio') || clean.includes('consulta general') || clean.includes('visita medica')) {
        showTypingAndReply(BOT_RESPONSES['2']);
      } else if (clean === '3' || clean.includes('enfermer') || clean.includes('suero') || clean.includes('inyecc') || clean.includes('sonda') || clean.includes('curaci') || clean.includes('escara') || clean.includes('puntos')) {
        showTypingAndReply(BOT_RESPONSES['3']);
      } else if (clean.includes('plan 1') || clean.includes('conexion') || clean.includes('15$')) {
        showTypingAndReply(BOT_RESPONSES.plan_1);
      } else if (clean.includes('plan 2') || clean.includes('alivio') || clean.includes('30$')) {
        showTypingAndReply(BOT_RESPONSES.plan_2);
      } else if (clean.includes('plan 3') || clean.includes('cuidado hogar') || clean.includes('40$')) {
        showTypingAndReply(BOT_RESPONSES.plan_3);
      } else if (clean.includes('plan 4') || clean.includes('bienestar integral') || clean.includes('60$')) {
        showTypingAndReply(BOT_RESPONSES.plan_4);
      } else if (clean.includes('plan 5') || clean.includes('pediat') || clean.includes('pequeños') || clean.includes('nino') || clean.includes('50$')) {
        showTypingAndReply(BOT_RESPONSES.plan_5);
      } else if (clean.includes('plan 6') || clean.includes('salud sin fronteras') || clean.includes('sin fronteras') || clean.includes('exterior') || clean.includes('padres') || clean.includes('80$')) {
        showTypingAndReply(BOT_RESPONSES.plan_6);
      } else if (clean === '4' || clean.includes('plan') || clean.includes('planes') || clean.includes('precio') || clean.includes('cuanto') || clean.includes('tarifa') || clean.includes('membresia')) {
        showTypingAndReply(BOT_RESPONSES['4']);
      } else if (clean === '5') {
        showTypingAndReply(BOT_RESPONSES['5']);
      } else if (clean === '6' || clean.includes('certificado') || clean.includes('conducir') || clean.includes('telemedicina')) {
        showTypingAndReply(BOT_RESPONSES['6']);
      } else if (clean === '7' || clean.includes('pago') || clean.includes('zona') || clean.includes('cobertura') || clean.includes('zelle')) {
        showTypingAndReply(BOT_RESPONSES['7']);
      } else if (clean === '8' || clean.includes('asesor') || clean.includes('humano') || clean.includes('persona')) {
        showTypingAndReply(BOT_RESPONSES['8']);
      } else if (clean.includes('hola') || clean.includes('buenas') || clean.includes('buenos dias') || clean.includes('menu') || clean.includes('lisa')) {
        showTypingAndReply(BOT_RESPONSES.menu);
      } else {
        showTypingAndReply(BOT_RESPONSES.fallback_empathetic);
      }
    }

    function sendMessage() {
      const text = input.value.trim();
      if (!text) return;
      addMessage(text, true);
      input.value = '';
      setTimeout(() => processUserInput(text), 300);
    }

    function handleQuickResponse(optionKey) {
      addMessage(optionKey, true);
      setTimeout(() => processUserInput(optionKey), 300);
    }

    function resetChat() {
      container.innerHTML = '';
      setTimeout(() => {
        addMessage(BOT_RESPONSES.menu, false);
      }, 400);
    }

    window.onload = () => {
      resetChat();
    };
  </script>
</body>
</html>
